    <script src="js/skeleton.js"></script>
    <style>
      @font-face {
        font-family: "Open Sans";
        font-display: swap;
        src: local("Open Sans");
      }
      /* ===== تنسيق جدول Hotkey ===== */
      #hotkeysListTable {
        width: 100%;
        border-collapse: collapse;
        background: #1a1a1a;
        border-radius: 8px;
        overflow: hidden;
        font-size: 14px;
      }
      #hotkeysListTable th {
        background: #2a2a2a;
        color: #1dd9e6e1;
        padding: 12px 8px;
        text-align: center;
        border-bottom: 2px solid #333;
      }
      #hotkeysListTable td {
        padding: 10px 8px;
        border-bottom: 1px solid #333;
        vertical-align: middle;
        text-align: center;
      }
      #hotkeysListTable tr:hover {
        background: #252525;
      }
      #hotkeysListTable .current-hotkey {
        background: #1a2a2a;
        border-left: 3px solid #1dd9e6e1;
      }
      #hotkeysListTable kbd {
        background: #1e2a36;
        padding: 4px 12px;
        border-radius: 4px;
        border: 1px solid #444;
        font-family: monospace;
        font-weight: bold;
        color: #1dd9e6e1;
      }
      /* ✅ أزرار تعديل/حذف جدول الاختصارات بنظام الأزرار الموحد
         (.row-act في table.css) — حُذفت التسكينة المحلية القديمة */
      .hotkey-toggle {
        width: 20px;
        height: 20px;
        accent-color: #1dd9e6e1;
        cursor: pointer;
      }
      /* ===== نهاية تنسيق Hotkey ===== */
    </style>

    <div id="appSkeleton" aria-hidden="true">
      <div class="sk-shell">
        <!-- سايد بار مطابق للتطبيق: شعار 112px ثم بروفايل 91px ثم صفوف 53px -->
        <div class="sk-sidebar">
          <div class="sk-logo-box"><div class="sk-logo"></div></div>
          <div class="sk-user">
            <div class="sk-avatar"></div>
            <div class="sk-user-lines">
              <div class="sk-line" style="width: 78%"></div>
              <div class="sk-line" style="width: 46%"></div>
            </div>
          </div>
          <nav class="sk-nav">
            <div class="sk-nav-row sk-active"></div>
            <div class="sk-nav-row"><i></i></div>
            <div class="sk-nav-row"><i></i></div>
            <div class="sk-nav-row"><i></i></div>
            <div class="sk-nav-row"><i></i></div>
            <div class="sk-nav-row"><i></i></div>
            <div class="sk-nav-row"><i></i></div>
          </nav>
          </div>
        <!-- الجسم يبدأ بعد السايد بار: شريط 53px ثم بطاقات بعرض كامل -->
        <div class="sk-main">
          <header class="sk-topbar">
            <div class="sk-line sk-teal" style="width: 250px; height: 15px"></div>
            <div class="sk-topbtns">
              <div class="sk-pill"></div>
              <div class="sk-pill"></div>
              <div class="sk-pill"></div>
              <div class="sk-pill sk-wide"></div>
            </div>
          </header>
          <div class="sk-content">
            <!-- بطاقة الحساب: صف دائرة+اسم ثم حقول — عرض كامل وارتفاع ~343 -->
            <div class="sk-card sk-account">
              <div class="sk-row">
                <div class="sk-avatar"></div>
                <div class="sk-user-lines">
                  <div class="sk-line" style="width: 200px"></div>
                  <div class="sk-line" style="width: 110px"></div>
                </div>
              </div>
              <div class="sk-input"></div>
              <div class="sk-input"></div>
              <div class="sk-cta" style="width: 220px"></div>
            </div>
            <!-- بطاقة الإعدادات: أزواج تسمية+حقل ×4 — عرض كامل وارتفاع ~669 -->
            <div class="sk-card sk-settings">
              <div class="sk-pair"><div class="sk-line" style="width: 120px"></div><div class="sk-input"></div></div>
              <div class="sk-pair"><div class="sk-line" style="width: 150px"></div><div class="sk-input"></div></div>
              <div class="sk-pair"><div class="sk-line" style="width: 100px"></div><div class="sk-input"></div></div>
              <div class="sk-pair"><div class="sk-line" style="width: 140px"></div><div class="sk-input"></div></div>
              <div class="sk-cta" style="width: 200px"></div>
            </div>
          </div>
        </div>
