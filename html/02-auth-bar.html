    <!-- ===== شريط المصادقة ===== -->
    <div class="auth-header">
      <div id="auth-status"></div>
      <div class="auth-buttons">
        <button id="login-btn" class="btn btn-secondary">
          <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
        </button>
        <button id="register-btn" class="btn btn-secondary">
          <i class="fas fa-user-plus"></i> إنشاء حساب
        </button>
        <button id="logout-btn" class="btn btn-secondary" style="display: none">
          <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
        </button>
        <!-- زر حذف الحساب أُزيل من الواجهة بطلب المستخدم -->
        <button
          id="delete-all-profile-btn"
          class="btn btn-danger"
          onclick="confirmDeleteAll()"
        >
          <i class="fas fa-trash"></i> حذف البروفايل
        </button>
        <div class="profile-actions">
          <button
            id="add-profile-btn"
            class="btn btn-secondary"
            title="استيراد أوامر من ملف JSON"
          >
            <i class="fas fa-upload"></i> اضافه البروفايل
          </button>
          <button
            id="copy-profile-btn"
            class="btn btn-secondary"
            title="تصدير الأوامر إلى ملف JSON"
          >
            <i class="fas fa-download"></i> نسخ البروفايل
          </button>
        </div>
        <button id="upgrade-btn" class="btn btn-warning" style="display: none">
          <i class="fas fa-crown"></i> اشتراك فى خطه
        </button>
        <button id="langToggle" class="btn btn-secondary" title="Language">
          <i class="fas fa-language"></i> <span id="langToggleLabel">عربي</span>
        </button>
      </div>
    </div>

    <div
      id="subscription-notification"
      class="notification-bar"
      style="display: none"
    ></div>
    <div
      id="storage-notification"
      class="notification-bar storage-warning"
      style="display: none"
    ></div>

    <!-- Login Modal -->
    <div id="login-modal" class="modal">
      <div class="modal-content">
        <span class="close-modal" id="close-login">&times;</span>
        <h2>تسجيل الدخول</h2>
        <input type="email" id="login-email" placeholder="البريد الإلكتروني" />
        <div style="position: relative">
          <input
            type="password"
            id="login-password"
            placeholder="كلمة المرور"
            style="padding-right: 44px"
          />
          <span
            id="login-password-toggle"
            title="إظهار / إخفاء كلمة المرور"
            style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; user-select: none; font-size: 16px;"
            ><i class="fas fa-eye"></i></span
          >
        </div>
        <button id="login-submit" class="btn btn-primary btn-block">
          دخول
        </button>
        <p id="login-message" style="color: #ff6b6b; margin-top: 10px"></p>
      </div>
    </div>
    <div id="register-modal" class="modal">
      <div class="modal-content">
        <span class="close-modal" id="close-register">&times;</span>
        <h2>إنشاء حساب جديد</h2>
        <input
          type="email"
          id="register-email"
          placeholder="البريد الإلكتروني"
        />
        <div style="position: relative; margin-top: 10px">
          <input
            type="password"
            id="register-password"
            placeholder="كلمة المرور"
            style="padding-right: 44px"
          />
        <span
          id="register-password-toggle"
          title="إظهار / إخفاء كلمة المرور"
          style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; user-select: none; font-size: 16px;"
          ><i class="fas fa-eye"></i></span
        >
        </div>
        <div style="position: relative; margin-top: 10px">
          <input
            type="password"
            id="register-confirm-password"
            placeholder="تأكيد كلمة المرور"
            style="padding-right: 44px; width: 100%"
          />
          <span
            id="register-confirm-toggle"
            title="إظهار / إخفاء كلمة المرور"
            style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; user-select: none; font-size: 16px;"
            ><i class="fas fa-eye"></i></span
          >
        </div>
        <button id="register-submit" class="btn btn-primary btn-block">
          تسجيل
        </button>
        <p id="register-message" style="color: #ff6b6b; margin-top: 10px"></p>
      </div>
    </div>
