<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم الـ Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #090a0f;
            color: #ffffff;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-wrapper { max-width: 1100px; width: 100%; }
        .header-title { text-align: center; margin-bottom: 28px; font-size: 1.7rem; font-weight: 900; background: linear-gradient(135deg, #00ffe1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .panel {
            background: #12131c; border: 1px solid #26283b; border-radius: 16px;
            padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 14px;
        }
        .panel-1 { border-top: 3px solid #00ffe1; }
        .panel-2 { border-top: 3px solid #ffcc00; }
        .panel h2 { font-size: 1.1rem; text-align: center; }
        .panel-1 h2 { color: #00ffe1; }
        .panel-2 h2 { color: #ffcc00; }

        .link-box {
            background: rgba(0, 255, 225, 0.05); border: 1px dashed #00ffe1;
            padding: 10px 14px; border-radius: 10px; display: flex;
            align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
        }
        .panel-2 .link-box { background: rgba(255, 204, 0, 0.05); border-color: #ffcc00; }
        .link-box label { font-size: 0.8rem; font-weight: 600; color: #d1d5db; }
        .link-box .link-url { font-size: 0.7rem; color: #8888aa; background: #0b0c14; padding: 4px 10px; border-radius: 6px; font-family: monospace; word-break: break-all; flex: 1; }
        .copy-btn {
            background: #00ffe1; color: #000; border: none; padding: 6px 14px;
            border-radius: 6px; font-weight: 700; font-size: 0.8rem; cursor: pointer;
        }
        .panel-2 .copy-btn { background: #ffcc00; }
        .copy-btn:hover { opacity: 0.75; }

        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 0.75rem; font-weight: 700; color: #b0b0d0; }
        input[type="text"], textarea, select {
            width: 100%; padding: 8px 12px; background: #1b1d2a;
            border: 1px solid #26283b; border-radius: 8px; color: #fff;
            font-family: 'Cairo', sans-serif; font-size: 0.85rem; outline: none;
        }
        textarea { resize: vertical; min-height: 80px; }

        .crown-selector-list {
            display: flex; flex-wrap: wrap; gap: 6px; background: #1b1d2a;
            padding: 8px 10px; border-radius: 8px; border: 1px solid #26283b;
            max-height: 120px; overflow-y: auto; align-items: center;
        }
        .crown-item-btn {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            color: #a0a0c0; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem;
            cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
        }
        .crown-item-btn.active { background: rgba(255, 204, 0, 0.18); border-color: #ffcc00; color: #ffcc00; font-weight: 700; }

        .color-pickers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .color-item { display: flex; align-items: center; gap: 6px; background: #1b1d2a; padding: 4px 8px; border-radius: 8px; border: 1px solid #26283b; }
        .color-item input[type="color"] { border: none; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; background: none; padding: 0; }
        .color-item span { font-size: 0.7rem; color: #a0a0c0; }

        .status { font-size: 0.75rem; color: #10b981; text-align: center; height: 20px; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1b1d2a; border: 1px solid #00ffe1; padding: 10px 24px; border-radius: 12px; font-size: 0.9rem; color: #fff; box-shadow: 0 8px 30px rgba(0,0,0,0.7); opacity: 0; transition: opacity 0.3s ease; pointer-events: none; z-index: 999; text-align: center; max-width: 90vw; }
        .toast.show { opacity: 1; }
        @media (max-width: 720px) { .control-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <h1 class="header-title">🎛️ لوحة تحكم الـ Overlays</h1>
        <div class="control-grid">
            <!-- Panel 1 -->
            <div class="panel panel-1">
                <h2>🎮 القائمة الأولى</h2>
                <div class="link-box">
                    <label>🔗 رابط OBS:</label>
                    <span class="link-url" id="linkDisplay1">جاري التحميل...</span>
                    <button class="copy-btn" data-overlay="1">📋 نسخ الرابط</button>
                </div>
                <div class="form-group">
                    <label>العنوان</label>
                    <input type="text" id="titleInput1" value="🏆 قائمة الأساطير">
                </div>
                <div class="form-group">
                    <label>الأسماء (كل اسم في سطر)</label>
                    <textarea id="namesInput1" placeholder="اكتب الأسماء..."></textarea>
                </div>
                <div class="form-group">
                    <label>تحديد التاج 👑</label>
                    <div class="crown-selector-list" id="crownList1"></div>
                </div>
                <div class="form-group">
                    <label>الثيم</label>
                    <select id="themeSelect1">
                        <option value="theme-neon">⚡ نيون سايبر</option>
                        <option value="theme-gold">👑 VIP ذهبي</option>
                        <option value="theme-purple">💜 بنفسجي</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>الألوان</label>
                    <div class="color-pickers">
                        <div class="color-item"><input type="color" id="glowColor1" value="#00ffe1"><span>التوهج</span></div>
                        <div class="color-item"><input type="color" id="badgeColor1" value="#ff0055"><span>الأرقام</span></div>
                    </div>
                </div>
                <div class="status" id="status1"></div>
            </div>

            <!-- Panel 2 -->
            <div class="panel panel-2">
                <h2>⭐ القائمة الثانية</h2>
                <div class="link-box">
                    <label>🔗 رابط OBS:</label>
                    <span class="link-url" id="linkDisplay2">جاري التحميل...</span>
                    <button class="copy-btn" data-overlay="2">📋 نسخ الرابط</button>
                </div>
                <div class="form-group">
                    <label>العنوان</label>
                    <input type="text" id="titleInput2" value="🔥 كبار الداعمين">
                </div>
                <div class="form-group">
                    <label>الأسماء (كل اسم في سطر)</label>
                    <textarea id="namesInput2" placeholder="اكتب الأسماء..."></textarea>
                </div>
                <div class="form-group">
                    <label>تحديد التاج 👑</label>
                    <div class="crown-selector-list" id="crownList2"></div>
                </div>
                <div class="form-group">
                    <label>الثيم</label>
                    <select id="themeSelect2">
                        <option value="theme-gold">👑 VIP ذهبي</option>
                        <option value="theme-neon">⚡ نيون سايبر</option>
                        <option value="theme-purple">💜 بنفسجي</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>الألوان</label>
                    <div class="color-pickers">
                        <div class="color-item"><input type="color" id="glowColor2" value="#ffcc00"><span>التوهج</span></div>
                        <div class="color-item"><input type="color" id="badgeColor2" value="#a855f7"><span>الأرقام</span></div>
                    </div>
                </div>
                <div class="status" id="status2"></div>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        // ===== إعدادات البيئة =====
        // سيتم تعيين هذه القيم من السيرفر أو من المتغيرات العامة
        const API_BASE = window.API_BASE || 'https://backend-7hj8.onrender.com';

        // جلب token من query string (إذا كان موجوداً)
        const urlParams = new URLSearchParams(window.location.search);
        const queryToken = urlParams.get('token');

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  TOAST & COPY
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let toastTimeout;
        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => el.classList.remove('show'), 4000);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  جلب screenToken (من query أو من السيرفر)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let screenToken = queryToken || null;

        async function fetchScreenToken() {
            // إذا كان لدينا token من query، استخدمه مباشرة
            if (screenToken) return true;

            try {
                const res = await fetch(`${API_BASE}/api/user/screen-token`, {
                    credentials: 'include'
                });
                const json = await res.json();
                if (json.success) {
                    screenToken = json.token;
                    return true;
                } else {
                    showToast('⚠️ فشل جلب رمز الشاشة: ' + (json.message || 'يرجى تسجيل الدخول'));
                    return false;
                }
            } catch (e) {
                showToast('⚠️ خطأ في الاتصال بالسيرفر');
                return false;
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  تحديث رابط OBS للـ overlay
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function updateOverlayLink(overlayId) {
            if (!screenToken) {
                document.getElementById(`linkDisplay${overlayId}`).textContent = 'غير متاح (سجل الدخول)';
                return;
            }
            // استخدام API_BASE لأن ملفات التراكب على الباك إند
            const url = `${API_BASE}/overlays/overlay${overlayId}.html?token=${screenToken}`;
            document.getElementById(`linkDisplay${overlayId}`).textContent = url;
            const btn = document.querySelector(`.copy-btn[data-overlay="${overlayId}"]`);
            btn.dataset.url = url;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  زر النسخ
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        document.querySelectorAll('.copy-btn').forEach(btn => {
            btn.addEventListener('click', async function() {
                const url = this.dataset.url;
                if (!url) {
                    showToast('⚠️ الرابط غير جاهز بعد، حاول مجدداً');
                    return;
                }
                try {
                    await navigator.clipboard.writeText(url);
                    showToast(`✅ تم نسخ الرابط! ضعه في OBS:\n${url}`);
                } catch (err) {
                    const dummy = document.createElement('input');
                    dummy.value = url;
                    document.body.appendChild(dummy);
                    dummy.select();
                    document.execCommand('copy');
                    dummy.remove();
                    showToast(`✅ تم النسخ (احتياطي):\n${url}`);
                }
            });
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  MAIN CONTROLLER (API VERSION)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        class Controller {
            constructor(id) {
                this.id = id;
                this.crownedIndices = new Set();
                this.titleInput = document.getElementById(`titleInput${id}`);
                this.namesInput = document.getElementById(`namesInput${id}`);
                this.themeSelect = document.getElementById(`themeSelect${id}`);
                this.glowColor = document.getElementById(`glowColor${id}`);
                this.badgeColor = document.getElementById(`badgeColor${id}`);
                this.crownList = document.getElementById(`crownList${id}`);
                this.status = document.getElementById(`status${id}`);
                this.linkDisplay = document.getElementById(`linkDisplay${id}`);

                this.bindEvents();
                this.loadFromServer();
            }

            async loadFromServer() {
                try {
                    // استخدام API_BASE وإضافة token في query إن وجد
                    let url = `${API_BASE}/api/overlay`;
                    if (screenToken) {
                        url += `?token=${screenToken}`;
                    }
                    const res = await fetch(url, {
                        credentials: 'include'
                    });
                    const json = await res.json();
                    if (json.success) {
                        const data = json.data[`overlay${this.id}`];
                        this.titleInput.value = data.title || '';
                        this.namesInput.value = (data.names || []).join('\n');
                        this.themeSelect.value = data.theme || 'theme-neon';
                        this.glowColor.value = data.glowColor || '#00ffe1';
                        this.badgeColor.value = data.badgeColor || '#ff0055';
                        this.crownedIndices = new Set(data.crownedIndices || []);
                        this.updateCrownsUI();
                        this.status.textContent = '✓ تم التحميل من السيرفر';
                        updateOverlayLink(this.id);
                    } else {
                        this.status.textContent = '⚠️ فشل التحميل: ' + (json.message || 'غير مصرح');
                        if (json.message && json.message.includes('token')) {
                            showToast('⚠️ يرجى تسجيل الدخول أولاً');
                        }
                    }
                } catch (e) {
                    this.status.textContent = '⚠️ فشل تحميل الإعدادات';
                    console.error(e);
                }
            }

            async saveToServer() {
                const payload = {
                    title: this.titleInput.value,
                    names: this.namesInput.value.split('\n').filter(s => s.trim() !== ''),
                    theme: this.themeSelect.value,
                    glowColor: this.glowColor.value,
                    badgeColor: this.badgeColor.value,
                    crownedIndices: Array.from(this.crownedIndices)
                };

                try {
                    const res = await fetch(`${API_BASE}/api/overlay/${this.id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(payload)
                    });
                    const json = await res.json();
                    if (json.success) {
                        this.status.textContent = '✓ تم الحفظ على السيرفر';
                        setTimeout(() => { this.status.textContent = ''; }, 1500);
                    } else {
                        this.status.textContent = '❌ فشل الحفظ: ' + (json.message || '');
                    }
                } catch (e) {
                    this.status.textContent = '❌ خطأ في الاتصال';
                    console.error(e);
                }
            }

            toggleCrown(idx) {
                if (this.crownedIndices.has(idx)) this.crownedIndices.delete(idx);
                else this.crownedIndices.add(idx);
                this.updateCrownsUI();
                this.saveToServer();
            }

            updateCrownsUI() {
                const names = this.namesInput.value.split('\n').filter(s => s.trim() !== '');
                this.crownList.innerHTML = '';
                if (names.length === 0) {
                    this.crownList.innerHTML = '<span style="font-size:0.7rem;color:#666688;">لا توجد أسماء</span>';
                    return;
                }
                names.forEach((name, idx) => {
                    const btn = document.createElement('button');
                    const isCrowned = this.crownedIndices.has(idx);
                    btn.className = `crown-item-btn ${isCrowned ? 'active' : ''}`;
                    btn.textContent = `${isCrowned ? '👑' : '⚪'} ${name.trim()}`;
                    btn.addEventListener('click', () => this.toggleCrown(idx));
                    this.crownList.appendChild(btn);
                });
            }

            bindEvents() {
                const saveable = [this.titleInput, this.themeSelect, this.glowColor, this.badgeColor];
                saveable.forEach(el => {
                    el.addEventListener('input', () => this.saveToServer());
                    el.addEventListener('change', () => this.saveToServer());
                });
                this.namesInput.addEventListener('input', () => {
                    this.updateCrownsUI();
                    this.saveToServer();
                });
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  INIT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        (async function init() {
            const hasToken = await fetchScreenToken();
            if (!hasToken) {
                showToast('⚠️ لم يتم العثور على رمز الشاشة، يرجى تسجيل الدخول');
            }

            const c1 = new Controller(1);
            const c2 = new Controller(2);

            window.controllers = { c1, c2 };
            console.log('✅ لوحة التحكم متصلة بالسيرفر لكل مستخدم!');
        })();
    </script>
</body>
</html>
