directories:
  output: build
  buildResources: build
appId: com.streammoon.app
productName: SteamMoon
forceCodeSigning: false
files:
  - filter:
      - electron-main.js
      - preload.js
      - index.html
      - main.js
      - live-window-preload.js
      - tunnel-window-preload.js
      - tunnel-cdp-intercept.js
      - css/**/*
      - images/**/*
      - favicon_io/**/*
      - webfonts/**/*
      - resources/**/*
win:
  target: nsis
  executableName: SteamMoon
  artifactName: ${productName}-Setup-${version}.${ext}
  publisherName: StreamMoon
  icon: icon.ico
  verifyUpdateCodeSignature: false
nsis:
  guid: a8f3b2e1-4c5d-6e7f-8a9b-0c1d2e3f4a5b
  perMachine: false
  oneClick: true
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SteamMoon
  uninstallDisplayName: SteamMoon
publish:
  provider: github
  owner: captenblank1
  repo: Stream-Moon-Program
  releaseType: release
electronVersion: 28.3.3
